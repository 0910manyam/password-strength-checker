<!DOCTYPE html>
<html>
<head>
    <title>Generate PWA Icons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1e1b4b;
            color: white;
            text-align: center;
        }
        canvas {
            border: 2px solid #7c3aed;
            margin: 10px;
            border-radius: 20px;
        }
        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #6d28d9;
        }
        .instructions {
            max-width: 600px;
            margin: 20px auto;
            background: rgba(124, 58, 237, 0.1);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>🔒 PWA Icon Generator</h1>
    
    <div class="instructions">
        <h3>Instructions:</h3>
        <ol style="text-align: left;">
            <li>Click "Generate Icons" below</li>
            <li>Right-click each icon and "Save Image As..."</li>
            <li>Save as <code>icon-192.png</code> and <code>icon-512.png</code></li>
            <li>Place them in <code>frontend/public/</code> folder</li>
        </ol>
    </div>

    <button onclick="generateIcons()">Generate Icons</button>
    
    <div id="icons"></div>

    <script>
        function generateIcons() {
            const iconsDiv = document.getElementById('icons');
            iconsDiv.innerHTML = '';
            
            // Generate 192x192 icon
            createIcon(192);
            
            // Generate 512x512 icon
            createIcon(512);
        }

        function createIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#7c3aed');
            gradient.addColorStop(1, '#5b21b6');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Draw shield
            const centerX = size / 2;
            const centerY = size / 2;
            const shieldWidth = size * 0.5;
            const shieldHeight = size * 0.6;
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - shieldHeight/2);
            ctx.lineTo(centerX + shieldWidth/2, centerY - shieldHeight/3);
            ctx.lineTo(centerX + shieldWidth/2, centerY + shieldHeight/4);
            ctx.lineTo(centerX, centerY + shieldHeight/2);
            ctx.lineTo(centerX - shieldWidth/2, centerY + shieldHeight/4);
            ctx.lineTo(centerX - shieldWidth/2, centerY - shieldHeight/3);
            ctx.closePath();
            ctx.fill();
            
            // Draw lock
            const lockSize = size * 0.15;
            ctx.fillStyle = '#7c3aed';
            
            // Lock body
            ctx.fillRect(centerX - lockSize/2, centerY, lockSize, lockSize * 1.2);
            
            // Lock shackle
            ctx.strokeStyle = '#7c3aed';
            ctx.lineWidth = size * 0.02;
            ctx.beginPath();
            ctx.arc(centerX, centerY, lockSize * 0.4, Math.PI, 0, true);
            ctx.stroke();
            
            // Add to page
            const container = document.createElement('div');
            container.style.display = 'inline-block';
            container.style.margin = '20px';
            
            const label = document.createElement('p');
            label.textContent = `${size}x${size}px`;
            label.style.marginBottom = '10px';
            
            container.appendChild(label);
            container.appendChild(canvas);
            
            const downloadBtn = document.createElement('button');
            downloadBtn.textContent = `Download ${size}x${size}`;
            downloadBtn.onclick = () => {
                const link = document.createElement('a');
                link.download = `icon-${size}.png`;
                link.href = canvas.toDataURL();
                link.click();
            };
            container.appendChild(downloadBtn);
            
            document.getElementById('icons').appendChild(container);
        }
    </script>
</body>
</html>
